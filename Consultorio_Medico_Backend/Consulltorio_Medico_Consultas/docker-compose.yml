version: '3.8'

services:
  mariadb-dev-con:
    image: mariadb:11
    container_name: mariadb-dev-con
    environment:
      MARIADB_ROOT_PASSWORD: 200232
      MARIADB_DATABASE: consultas
    ports:
      - "3309:3306"
    volumes:
      - mariadb_data_con:/var/lib/mysql
    command: --server-id=3 --log-bin=mysql-bin-con --binlog-format=ROW
    networks:
      - consultorio_net

  mariadb-dev-con-replica:
    image: mariadb:11
    container_name: mariadb-dev-con-replica
    environment:
      MARIADB_ROOT_PASSWORD: 200232
      MARIADB_DATABASE: consultas
    ports:
      - "3319:3306"
    volumes:
      - mariadb_replica_data_con:/var/lib/mysql
    command: --server-id=4 --log-bin=mysql-bin-con --binlog-format=ROW --relay-log=mysql-relay-bin-con
    networks:
      - consultorio_net

volumes:
  mariadb_data_con:
  mariadb_replica_data_con:

networks:
  consultorio_net:
    driver: bridge